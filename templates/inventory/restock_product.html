{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card glass-card p-5 mx-auto" style="max-width: 550px; border-radius: 16px; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.05);">
        
        <div class="mb-4 text-center">
            <span style="font-size: 2.5rem;">📦</span>
            <h3 class="fw-700 mt-2" style="font-weight: 700; color: #0f172a;">Inventory Restock Portal</h3>
            <p class="text-muted small">Top up current stock supply levels for selected active products</p>
        </div>

        <div class="p-3 mb-4 rounded-3 text-center" style="background: rgba(3,106,106,0.05); border: 1px solid rgba(3,106,106,0.1);">
            <h5 class="fw-bold mb-1" style="color: #036a6a;">{{ medicine.name }}</h5>
            <span class="text-muted small">Current Level on Shelves: <strong>{{ medicine.quantity }} units</strong></span>
        </div>

        <form action="{% url 'restock_product' medicine.id %}" method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">New Quantity Arriving</label>
                <input type="number" name="added_quantity" class="form-control" placeholder="e.g. 50" required 
                       style="border-radius: 8px; padding: 10px; border: 1px solid #cbd5e1;">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Update Unit Cost Price (Optional)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light" style="border-radius: 8px 0 0 8px; border: 1px solid #cbd5e1;">₦</span>
                    <input type="number" step="0.01" name="cost_price" class="form-control" value="{{ medicine.cost_price }}"
                           style="border-radius: 0 8px 8px 0; border: 1px solid #cbd5e1;">
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn text-white py-2" style="background: #036a6a; border-radius: 8px; font-weight: 600; border: none; transition: background 0.2s;"
                        onmouseover="this.style.background='#025353'" onmouseout="this.style.background='#036a6a'">
                    Confirm Stock Update
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-light py-2" style="border-radius: 8px; border: 1px solid #e2e8f0; color: #64748b; font-weight: 500;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
