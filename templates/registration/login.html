{% extends 'base.html' %}

{% block content %}
<style>
    :root {
        /* Professional Pharmacy Palette */
        --med-primary: #004d4d;
        --med-gradient: linear-gradient(135deg, #004d4d 0%, #002b2b 100%);
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: radial-gradient(circle at center, #ffffff 0%, #dbeafe 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .main-container {
        display: flex;
        width: 900px;
        height: 550px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    /* Left Side: The Branding Area */
    .side-panel {
        flex: 1;
        background: var(--med-gradient);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 40px;
        text-align: center;
    }

    /* Right Side: The Form Area */
    .form-panel {
        flex: 1.2;
        background: #ffffff;
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .form-panel h2 {
        margin: 0;
        font-size: 2.2rem;
        font-weight: 600;
        color: #1a1a1a;
    }

    .brand-line {
        width: 50px;
        height: 4px;
        background: var(--med-primary);
        margin: 15px 0 40px 0;
        border-radius: 2px;
    }

    /* Professional Form Elements */
    .form-group {
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 8px;
        font-weight: 500;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1.5px solid #eef0f2;
        border-radius: 12px;
        outline: none;
        transition: 0.3s;
        font-size: 0.95rem;
        background: #fafbfc;
        box-sizing: border-box;
    }

    input:focus {
        border-color: var(--med-primary);
        background: #fff;
        box-shadow: 0 0 10px rgba(0, 77, 77, 0.05);
    }

    .btn-login {
        background: var(--med-primary);
        color: white;
        border: none;
        padding: 14px 40px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
        margin-top: 10px;
        width: 100%;
    }

    .btn-login:hover {
        background: #003333;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 77, 77, 0.2);
    }

    .btn-signup-outline {
        border: 2px solid rgba(255, 255, 255, 0.4);
        color: white;
        padding: 12px 35px;
        border-radius: 30px;
        text-decoration: none;
        margin-top: 30px;
        font-size: 0.9rem;
        transition: 0.3s;
    }

    .btn-signup-outline:hover {
        background: white;
        color: var(--med-primary);
        border-color: white;
    }

    /* Back Link */
    .back-link {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #999;
        text-decoration: none;
        display: block;
        text-align: center;
    }

    /* Add this to the very bottom of your <style> block */

@media (max-width: 768px) {
    .main-container {
        flex-direction: column; /* Stacks the side-panel and form-panel */
        width: 95%;             /* Fluid width on mobile */
        height: auto;           /* Allows the container to grow with content */
        margin: 10px auto;      /* Center it */
    }

    .form-panel {
        padding: 40px 20px;     /* Adjust padding for smaller screens */
    }
}
</style>

<div class="main-container">
    <div class="side-panel">
        <h1 style="font-size: 2.5rem; letter-spacing: 2px;">HAVY</h1>
        <p style="opacity: 0.8; max-width: 250px; font-weight: 300;">Management System for Modern Healthcare
            Professionals</p>
        <a href="{% url 'signup' %}" class="btn-signup-outline">Request Access</a>
    </div>

    <div class="form-panel">
        <h2>Sign In</h2>
        <div class="brand-line"></div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group" style="position: relative;">
                <label>PASSWORD</label>
                <input type="password" id="id_password" name="password" placeholder="••••••••" required>

                <span onclick="togglePassword()"
                    style="position: absolute; right: 15px; top: 38px; cursor: pointer; opacity: 0.5; transition: 0.2s;">
                    <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
            </div>
            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>

        <a href="{% url 'home' %}" class="back-link">&larr; Back to Portal</a>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById("id_password");
        const icon = document.querySelector("#eye-icon");
        
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.style.opacity = "1"; // Highlight when active
        } else {
            passwordInput.type = "password";
            icon.style.opacity = "0.5";
        }
    }
</script>
{% endblock %}
