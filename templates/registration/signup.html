{% extends 'base.html' %}

{% block content %}
<style>
    :root {
        --med-primary: #004d4d;
        /* Deep Clinical Teal */
        --med-gradient: linear-gradient(135deg, #004d4d 0%, #002b2b 100%);
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        /* This creates a soft glow behind the container */
        background: radial-gradient(circle at center, #ffffff 0%, #dbeafe 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .main-container {
        display: flex;
        width: 1000px;
        /* Slightly wider to accommodate more fields */
        height: 650px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    /* Left Side: The Form Area */
    .form-panel {
        flex: 1.5;
        background: #ffffff;
        padding: 40px 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
        /* Just in case of smaller screens */
    }

    /* Right Side: The Branding Area */
    .side-panel {
        flex: 1;
        background: var(--med-gradient);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 40px;
        text-align: center;
    }

    .form-panel h2 {
        margin: 0;
        font-size: 2rem;
        color: #1a1a1a;
    }

    .brand-line {
        width: 50px;
        height: 4px;
        background: var(--med-primary);
        margin: 10px 0 30px 0;
        border-radius: 2px;
    }

    /* Input Styling */
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-size: 0.75rem;
        color: #888;
        margin-bottom: 5px;
        font-weight: 600;
        text-transform: uppercase;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border: 1.5px solid #eef0f2;
        border-radius: 10px;
        outline: none;
        transition: 0.3s;
        font-size: 0.9rem;
        background: #fafbfc;
        box-sizing: border-box;
    }

    input:focus,
    select:focus {
        border-color: var(--med-primary);
        background: #fff;
    }

    .btn-signup {
        background: var(--med-primary);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
        width: 100%;
        margin-top: 10px;
    }

    .btn-signup:hover {
        background: #003333;
        transform: translateY(-2px);
    }

    .btn-login-outline {
        border: 2px solid rgba(255, 255, 255, 0.4);
        color: white;
        padding: 10px 30px;
        border-radius: 30px;
        text-decoration: none;
        margin-top: 20px;
        font-size: 0.85rem;
        transition: 0.3s;
    }

    .btn-login-outline:hover {
        background: white;
        color: var(--med-primary);
    }

    .help-text {
        font-size: 0.7rem;
        color: #aaa;
        margin-top: 4px;
    }

    /* Responsive Breakpoints */
@media (max-width: 850px) {
    .main-container {
        flex-direction: column-reverse; /* Put form on top, branding on bottom */
        width: 95%;
        height: auto; /* Allow growth */
        max-height: 90vh; /* Don't exceed screen height */
    }

    .form-panel {
        padding: 30px;
    }

    .side-panel {
        padding: 30px;
    }
}

@media (max-width: 600px) {
    .form-row {
        grid-template-columns: 1fr; /* Force single column on tiny screens */
        gap: 0;
    }
}
</style>

<div class="main-container">
    <div class="form-panel">
        <h2>Join the Staff</h2>
        <div class="brand-line"></div>

        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="form-group"
                style="background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                {{ form.errors }}
            </div>
            {% endif %}

            <div class="form-row">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="johndoe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="john@havy.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Pharmacy Role</label>
                <select name="role">
                    <option value="Salesperson">Salesperson</option>
                    <option value="Admin">Pharmacist / Admin</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group" style="position: relative;">
                    <label>Password</label>
                    <input type="password" id="id_password1" name="password1" placeholder="••••" required>
                    <span onclick="togglePassword('id_password1', 'icon1')"
                        style="position: absolute; right: 12px; top: 32px; cursor: pointer; opacity: 0.5;">
                        <svg id="icon1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
                <div class="form-group" style="position: relative;">
                    <label>Confirm Password</label>
                    <input type="password" id="id_password2" name="password2" placeholder="••••" required>
                    <span onclick="togglePassword('id_password2', 'icon2')"
                        style="position: absolute; right: 12px; top: 32px; cursor: pointer; opacity: 0.5;">
                        <svg id="icon2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="form-group"
                style="background: #fdf2f2; padding: 15px; border-radius: 10px; border: 1px solid #fee2e2;">
                <label style="color: #991b1b;">Admin Access Key</label>
                <input type="password" name="admin_key" placeholder="Required only for Admins"
                    style="border-color: #fecaca;">
                <p class="help-text">Leave blank if registering as a Salesperson.</p>
            </div>

            <button type="submit" class="btn-signup">Register Account</button>
        </form>
    </div>

    <div class="side-panel">
        <h1 style="font-size: 2.2rem; letter-spacing: 2px;">HAVY</h1>
        <p style="opacity: 0.8; font-weight: 300;">Ready to manage your stock and sales?</p>
        <p style="font-size: 0.9rem; margin-top: 40px;">Already have an account?</p>
        <a href="{% url 'login' %}" class="btn-login-outline">Sign In Instead</a>
    </div>
</div>


<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
            input.type = "text";
            icon.style.opacity = "1";
        } else {
            input.type = "password";
            icon.style.opacity = "0.5";
        }
    }
</script>
{% endblock %}
